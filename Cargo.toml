[package]
name = "autodiff_emb"
version = "0.1.0"
edition = "2024"

[dependencies]
nalgebra = { version = "0.32", default-features = false }
num-traits = { version = "0.2", default-features = false }
libm = { version = "0.2", optional = true }
approx = { version = "0.5", default-features = false }
simba = { version = "0.8", default-features = false }

[features]
default = ["std"]
libm = ["dep:libm", "simba/libm", "nalgebra/libm", "num-traits/libm"]
std = ["approx/std", "simba/std", "num-traits/std", "nalgebra/std"]
alloc = ["nalgebra/alloc"]
